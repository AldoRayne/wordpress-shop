<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Text Pin Animation</title>
</head>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 50px;
    line-height: 1.6;
  }

  .trigger {
    font-size: 3rem;
    color: #000;
    height: 200vh;
    overflow: hidden;
  }

  .word {
    display: inline-block;
    white-space: nowrap; /* Запобігає переносу букв в межах слова */
  }

  .char {
    display: inline-block;
    transform: translateY(100%);
    opacity: 0;
    white-space: pre; /* Зберігає пробіли */
  }
</style>
<body>
<div class="trigger">
  <div class="text">Анімація тексту з GSAP тільки для великого тексту lorem ipsum</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const textElement = document.querySelector('.text');
    const textContent = textElement.textContent;

    // Розбиваємо текст на слова
    textElement.innerHTML = textContent.split(" ").map(word => {
      // Розбиваємо кожне слово на букви
      const letters = word.split("").map(letter => `<span class="char">${letter}</span>`).join("");
      return `<span class="word">${letters}&nbsp;</span>`; // Обгортаємо слово і додаємо пробіл
    }).join("");

    // Анімація
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".trigger",
        start: "top top", // Початок коли верх тригера досягне верху вікна
        end: "+=300vh", // Закріплення на 300vh
        scrub: true, // Синхронізація анімації з прокруткою
        pin: true, // Закріплення секції
        anticipatePin: 1
      }
    });

    tl.to(".char", {
      y: 0,
      opacity: 1,
      stagger: {
        each: 0.05,
        from: "start"
      },
      duration: 0.5,
      ease: "power2.out",
    });

    // Респонсивність без перезавантаження сторінки
    window.addEventListener("resize", () => {
      ScrollTrigger.refresh();
    });
  });
</script>
</body>
</html>
