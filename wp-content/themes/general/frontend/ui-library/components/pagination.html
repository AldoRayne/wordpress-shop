<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Title</title>
</head>
<body>
	<!-- Standard html of WP pagination -->
	<nav class="wp-block-query-pagination is-content-justification-space-between is-layout-flex wp-container-core-query-pagination-is-layout-1 wp-block-query-pagination-is-layout-flex" aria-label="Pagination">
		<a href="https://example.com/sample-page/" class="wp-block-query-pagination-previous"><span class="wp-block-query-pagination-previous-arrow is-arrow-arrow" aria-hidden="true">←</span>Previous</a>
		<div class="wp-block-query-pagination-numbers"><a class="page-numbers" href="https://example.com/sample-page/">1</a>
			<span aria-current="page" class="page-numbers current">2</span>
			<a class="page-numbers" href="https://example.com/page/3/">3</a></div>
		<a href="https://example.com/page/3/" class="wp-block-query-pagination-next">Next<span class="wp-block-query-pagination-next-arrow is-arrow-arrow" aria-hidden="true">→</span></a>
	</nav>


	<!-- Pagination from our theme without parameters -->
	<a class="page-numbers" href="https://example.com/blog-page/">1</a>
	<span aria-current="page" class="page-numbers current">2</span>
	<a class="page-numbers" href="https://example.com/blog-page/page/3/">3</a>
	<a class="page-numbers" href="https://example.com/blog-page/page/4/">4</a>
	<a class="next page-numbers" href="https://example.com/blog-page/page/3/">Next »</a>

	<!-- Pagination from our theme without parameters with dots -->
	<a class="prev page-numbers" href="https://example.com/blog-page/">« Previous</a>
	<a class="page-numbers" href="https://example.com/blog-page/">1</a>
	<span aria-current="page" class="page-numbers current">2</span>
	<a class="page-numbers" href="https://example.com/blog-page/page/3/">3</a>
	<a class="page-numbers" href="https://example.com/blog-page/page/4/">4</a>
	<span class="page-numbers dots">…</span>
	<a class="page-numbers" href="https://example.com/blog-page/page/11/">11</a>
	<a class="next page-numbers" href="https://example.com/blog-page/page/3/">Next »</a>

	<!-- Pagination from our theme without Prev/Next -->
	<a class="page-numbers" href="https://example.com/blog-page/">1</a>
	<span aria-current="page" class="page-numbers current">2</span>
	<a class="page-numbers" href="https://example.com/blog-page/page/3/">3</a>
	<a class="page-numbers" href="https://example.com/blog-page/page/4/">4</a>
</body>
</html>
