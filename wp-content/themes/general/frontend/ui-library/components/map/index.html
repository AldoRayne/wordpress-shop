<script>
    document.addEventListener('DOMContentLoaded', function () {

        // CUSTOM SELECT

        const customSelectInit = () => {
            const customSelects = document.querySelectorAll('.select');
            if (customSelects.length) {
                customSelects.forEach((select) => {
                    const selected = select.querySelector('.select__selected');
                    const items = select.querySelectorAll('.select__item');

                    // close select
                    const closeSelect = () => select.classList.remove('active');

                    // close all selects
                    const closeAllSelects = () =>
                            customSelects.forEach((select) => select.classList.remove('active'));

                    // toggle select
                    const toggleSelect = () => {
                        if (select.classList.contains('active')) {
                            closeSelect();
                            return;
                        }

                        closeAllSelects();
                        select.classList.add('active');
                    };

                    // change select
                    const changeSelect = (target) => {
                        const targetText = target.textContent;

                        selected.classList.remove('select__placeholder');
                        selected.textContent = targetText;
                    };

                    // events
                    select.addEventListener('click', toggleSelect);

                    items.forEach((item) => item.addEventListener('click', ({target}) => changeSelect(target)));

                    window.addEventListener('click', ({target}) => {
                        if (target.closest('.select') === null) {
                            closeAllSelects();
                        }
                    });
                });
            }
        };

        var autocomplete;
        var mapInit = function mapInit() {
            var mapSection = document.querySelector('.map');
            if (mapSection) {
                // Отримуємо елементи карти, форми та параметри
                const mapBlock = mapSection.querySelector('#map');
                const mapMarkerWrapper = mapSection.querySelector('.map__wrapper');
                const form = mapSection.querySelector('.map__navigation');
                const input = form.querySelector('.map__input');
                const selectWrap = mapSection.querySelector('.map__select .select__list');

                const currentLang = mapSection.dataset.currentLanguage.toLowerCase();
                const errorNotExist = form.querySelector('.not-exist');
                const errorNotMarkers = form.querySelector('.not-markers');
                const fileUrl = mapSection.dataset.fileUrl;
                const cluster_icon = mapSection.dataset.cluster_icon;
                const marker_icon = mapSection.dataset.marker_icon;
                const countriesUrl = mapSection.dataset.countries;

                const mapLat = +mapBlock.dataset.lat;
                const mapLng = +mapBlock.dataset.lng;

                // Встановлюємо стандартні координати та масштаб
                let defaultCoords = {
                    lat: mapLat,
                    lng: mapLng,
                };
                let zoom = 3;

                // Масиви маркерів, списків країн та інші змінні
                let markersArr = [];
                let infoWindow = null;
                let map = null;
                let countryList = [];
                let countryCodesArray = [];
                let selectItems, place;
                let errors = form.querySelectorAll('.map__error');

                // Завантажуємо дані
                parseCsv();

                // Додаємо слухач введення для очищення помилок
                input.addEventListener('input', function (event) {
                    resetErrors();
                });


                // Скидання помилок
                var resetErrors = function resetErrors() {
                    errors.forEach(function (error) {
                        return error.classList.remove('map__error--active');
                    });
                };

                // Перевіряємо, чи знаходяться маркери у межах карти
                var isMarkersInBoundary = function isMarkersInBoundary(error) {
                    var status = true;
                    var bounds = map.getBounds();
                    var boundaryRectangle = new google.maps.Rectangle({
                        bounds: {
                            north:
                                    bounds.getNorthEast().lat() -
                                    (bounds.getNorthEast().lat() - bounds.getSouthWest().lat()) * 0.1,
                            south:
                                    bounds.getSouthWest().lat() +
                                    (bounds.getNorthEast().lat() - bounds.getSouthWest().lat()) * 0.1,
                            east:
                                    bounds.getNorthEast().lng() -
                                    (bounds.getNorthEast().lng() - bounds.getSouthWest().lng()) * 0.1,
                            west:
                                    bounds.getSouthWest().lng() +
                                    (bounds.getNorthEast().lng() - bounds.getSouthWest().lng()) * 0.1,
                        },
                        editable: false,
                        draggable: false,
                        clickable: false,
                        fillOpacity: 0,
                        strokeOpacity: 0,
                    });
                    resetErrors();
                    boundaryRectangle.setMap(map);
                    for (let i = 0; i < markersArr.length; i++) {
                        const marker = markersArr[i];
                        status = boundaryRectangle.getBounds().contains(marker.getPosition());

                            '</div>';

                    // Закриваємо вікно при кліку на карту
                    google.maps.event.addListener(map, 'click', function () {
                        return infoWindow.close();
                    });

                    // Відкриваємо вікно при кліку на маркер

                    locationBtn.classList.add('location-btn');
                    locationBtn.innerHTML += locationIcon;
                    map.controls[google.maps.ControlPosition.RIGHT_TOP].push(locationBtn);

                    // Ініціалізація маркера геолокації

                // Зосередження на країні
                function focusOnCountry(countryName, map, type) {
                    const geocoder = new google.maps.Geocoder();

                    geocoder.geocode({address: countryName}, function (results, status) {
                        if (status == 'OK') {
                            let bounds;
                            if (type === 'country') {
                                bounds = results[0].geometry.viewport;
                            } else {
                                const cityCenter = results[0].geometry.location;

                                // Визначаємо дві точки для меж
                                const northPoint = google.maps.geometry.spherical.computeOffset(cityCenter, 50000, 0); // 50km to the North
                                const southPoint = google.maps.geometry.spherical.computeOffset(cityCenter, 50000, 180); // 50km to the South

                                // Create bounds object
                                bounds = new google.maps.LatLngBounds();
                                bounds.extend(northPoint);
                                bounds.extend(southPoint);
                            }

                            // Adjust the map's viewport
                            map.fitBounds(bounds);
                            const currentZoom = map.getZoom();
                            map.setZoom(currentZoom);
                        } else {
                            console.error('Geocode was not successful for the following reason: ' + status);
                        }
                    });
                }

                            }
                            return await response.json();
                        } catch (error) {
